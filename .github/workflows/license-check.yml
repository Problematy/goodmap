name: License Check

on:
  pull_request:
    branches:
      - main
      - next

permissions:
  contents: read

jobs:
  license-check:
    name: Dependency License Review
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          allow-licenses: >-
            Apache-2.0,
            MIT,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            CC0-1.0,
            Unlicense,
            EPL-1.0,
            EPL-2.0,
            CDDL-1.0,
            PSF-2.0,
            Python-2.0,
            MPL-2.0,
            0BSD,
            Artistic-1.0-Perl,
            MIT-CMU,
            MIT-0,
            Zlib,
            ZPL-2.1,
            BSD-2-Clause-Views
          # Per-package exemptions (comments can't go inside the folded list below):
          # - typing-extensions: PSF-2.0; ships CPython's LICENSE, whose GPL-compatibility notes get misread as GPL.
          # - protobuf: BSD-3-Clause, but declared as a free-text "3-Clause BSD License" the scanner can't match.
          # - aiohappyeyeballs: PSF-2.0; ships CPython's LICENSE, whose GPL-compatibility notes get misread as GPL.
          # - pygithub: LGPL-3.0 via platzky; only imported, not modified or vendored, which LGPL permits.
          # - react-leaflet, @react-leaflet/core: Hippocratic-2.1, not OSI-approved.
          #   TODO: migrate to vanilla Leaflet (BSD-2-Clause) to make the frontend fully MIT-compatible.
          allow-dependencies-licenses: >-
            pkg:pypi/typing-extensions,
            pkg:pypi/protobuf,
            pkg:pypi/aiohappyeyeballs,
            pkg:pypi/pygithub,
            pkg:npm/react-leaflet,
            pkg:npm/@react-leaflet/core
