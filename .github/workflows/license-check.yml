name: License Check

on:
  pull_request:
    branches:
      - main
      - next

permissions:
  contents: read

jobs:
  license-check:
    name: Dependency License Review
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          allow-licenses: >-
            Apache-2.0,
            MIT,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            CC0-1.0,
            Unlicense,
            EPL-1.0,
            EPL-2.0,
            CDDL-1.0,
            PSF-2.0,
            Python-2.0,
            MPL-2.0,
            0BSD,
            Artistic-1.0-Perl
          # TODO: migrate away from react-leaflet (Hippocratic-2.1) to vanilla Leaflet (BSD-2-Clause)
          # to make the frontend fully MIT-compatible. Tracked in allow-packages until migration is done.
          allow-packages: >-
            pkg:pypi/typing-extensions,
            pkg:pypi/protobuf,
            pkg:npm/react-leaflet,
            pkg:npm/%40react-leaflet%2Fcore
